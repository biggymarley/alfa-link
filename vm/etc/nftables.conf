#!/usr/sbin/nft -f
flush ruleset
table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    oifname "wl*" masquerade
  }
}
table ip filter {
  chain forward {
    type filter hook forward priority 0; policy accept;
    # never bounce Mac traffic back out the vmnet NIC (only the USB Wi-Fi may carry it)
    iifname "en*" oifname "en*" drop
    iifname "wg0" oifname "en*" drop
    tcp flags syn tcp option maxseg size set rt mtu
  }
}

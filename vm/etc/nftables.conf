#!/usr/sbin/nft -f
flush ruleset
table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    # only the USB Wi-Fi uplink is NATed (Mac tunnel + hotspot clients go out here)
    oifname "wl*" masquerade
  }
}
table ip filter {
  chain input {
    type filter hook input priority 0; policy accept;
    # hotspot clients may only use DHCP/DNS (and ping) on the VM — no SSH etc.
    iifname "ap0" ct state established,related accept
    iifname "ap0" udp dport { 53, 67 } accept
    iifname "ap0" tcp dport 53 accept
    iifname "ap0" icmp type echo-request accept
    iifname "ap0" drop
  }
  chain forward {
    type filter hook forward priority 0; policy accept;
    # never bounce traffic back out the vmnet NIC (only the USB Wi-Fi may carry it)
    iifname "en*" oifname "en*" drop
    iifname "wg0" oifname "en*" drop
    # hotspot clients: internet only — not the Mac (wg0), not the Mac's network (en*)
    iifname "ap0" oifname != "wl*" drop
    oifname "ap0" ct state established,related accept
    oifname "ap0" drop
    tcp flags syn tcp option maxseg size set rt mtu
  }
}
